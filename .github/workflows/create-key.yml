name: Create signing key (one time)

# Uses YOUR password from the secret ANDROID_KEYSTORE_PASSWORD.
# Nothing is printed in the logs. After you have saved the files and added
# the secrets, delete this workflow, the run and the artifact.

on:
  workflow_dispatch:

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - name: Make the key
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "Add the secret ANDROID_KEYSTORE_PASSWORD first (your own password)."
            exit 1
          fi
          keytool -genkeypair -keystore inkar-release.jks -storetype PKCS12 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" -alias inkar \
            -keyalg RSA -keysize 4096 -validity 36500 \
            -dname "CN=Inkar, O=McFoster"
          {
            echo "ANDROID_KEY_ALIAS"
            echo "inkar"
            echo
            echo "ANDROID_KEY_PASSWORD"
            echo "(the same password you put in ANDROID_KEYSTORE_PASSWORD)"
            echo
            echo "ANDROID_KEYSTORE_BASE64"
            base64 -w 0 inkar-release.jks
            echo
          } > inkar-secrets.txt

      - uses: actions/upload-artifact@v4
        with:
          name: inkar-signing-key
          path: |
            inkar-release.jks
            inkar-secrets.txt
          retention-days: 1
