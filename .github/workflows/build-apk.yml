name: Build Inkar APK

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'stable = real app (com.mcfoster.inkar), dev = test app (com.mcfoster.inkar.dev)'
        type: choice
        options:
          - stable
          - dev
        default: dev
      version:
        description: 'Version number, for example 1.0.0'
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "One of the four signing secrets is missing. Not building."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build the APK
        run: gradle assembleRelease --no-daemon -PappChannel=${{ inputs.channel }} -PappVersionName=${{ inputs.version }} -PappVersionCode=${{ github.run_number }}

      - name: Sign the APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "$KS_B64" | base64 -d > release.jks
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          if [ "${{ inputs.channel }}" = "stable" ]; then NAME="Inkar-v${{ inputs.version }}.apk"; else NAME="Inkar-dev-v${{ inputs.version }}.apk"; fi
          "$BT/apksigner" sign --ks release.jks --ks-pass pass:"$KS_PASS" --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASS" --out "$NAME" aligned.apk
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          rm -f release.jks

      - name: Publish the stable release
        if: inputs.channel == 'stable'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Inkar v${{ inputs.version }}
          files: ${{ env.APK_NAME }}
          prerelease: false

      - name: Publish the dev pre-release
        if: inputs.channel == 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-v${{ inputs.version }}
          name: Inkar dev v${{ inputs.version }}
          files: ${{ env.APK_NAME }}
          body: Test build. It installs next to the real Inkar.
          prerelease: true
